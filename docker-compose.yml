services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyroom
      POSTGRES_PASSWORD: studyroom
      POSTGRES_DB: studyroom
    ports:
      - '5432:5432'
    volumes:
      - studyroom-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studyroom -d studyroom']
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      STORE: prisma
      DATABASE_URL: postgresql://studyroom:studyroom@db:5432/studyroom?schema=public
      CORS_ORIGIN: http://localhost:5173
      PRESENCE_GRACE_MS: 15000
      MAX_MEMBERS: 30
      ROOM_TTL_DAYS: 7
      TRUST_PROXY: 0
    ports:
      - '3001:3001'

volumes:
  studyroom-db:
